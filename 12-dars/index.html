<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <script src="./app.js"> </script> 

  <div class="big-box">

   
    <div class="result-box">
      <h3 class="result-title">Your Result</h3>
      
    
      <div class="circle">
        <span class="score">76</span>
        <span class="total">of 100</span>
      </div>

      <h2 class="result-grade">Great</h2>
      <p class="result-text">
        Your performance exceeded 65% of the people conducting the test here!
      </p>
    </div>

    <div class="summary-box">
      <h3 class="summary-title">Summary</h3>

      <div class="summary-list">
      
        <div class="summary-item reaction">
          <div class="item-left">
           <a href="icon"><img src="./images/iconoir_flash.svg" alt=""></a>
            <span class="item-name">Reaction</span>
          </div>
          <div class="item-score"><b>80</b> / 100</div>
        </div>

        <div class="summary-item memory">
          <div class="item-left">
            <a href="icon"><img src="./images/icon_2.svg" alt=""></a>
            <span class="item-name">Memory</span>
          </div>
          <div class="item-score"><b>92</b> / 100</div>
        </div>

        <div class="summary-item verbal">
          <div class="item-left">
           <a href="icon"><img src="./images/icon-3.svg" alt=""></a>
            <span class="item-name">Verbal</span>
          </div>
          <div class="item-score"><b>61</b> / 100</div>
        </div>

        <div class="summary-item visual">
          <div class="item-left">
           <a href="icon"><img src="./images/icon-4.svg" alt=""></a>
            <span class="item-name">Visual</span>
          </div>
          <div class="item-score"><b>73</b> / 100</div>
        </div>
      </div>

      <button class="btn-continue">Continue</button>
    </div>

  </div>

</body>
</html>
